name: Build SEO pages and deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 21 * * *'   # every night (3:00 AM India time) so new products get their own pages
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build category + product pages and sitemap
        run: node tools/build-seo.mjs
        continue-on-error: true
      - name: Collect the site files
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='tools' --exclude='_site' --exclude='README.md' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
